:root{

/* 鈹€鈹€ 鏌ョ湅鏇村妗堜緥锛堟姌鍙狅級 鈹€鈹€ */
.case-toggle{display:flex;align-items:center;gap:12px;width:100%;

.case-fold.open .case-toggle .chev{transform:rotate(180deg)}

function zoomWrap(src,alt){
  return `<span class="zoom-wrap"><img src="${src}" alt="${alt}" loading="lazy">
    <span class="zoom-badge">${zoomSVG}</span><span class="zoom-tip">鐐瑰嚮鏀惧ぇ</span></span>`;
}
function vcard(p,i){
  const media=p.video
    ? `<div class="vmedia"><span class="vid">${playSVG} 瑙嗛婕旂ず</span>
       <video src="${p.video}" controls preload="metadata" poster="${p.poster}" playsinline></video></div>`
    : `<div class="vmedia img"><span class="vid">${p.badge||"浣滃搧灞曠ず"}</span>${zoomWrap(p.img,p.title)}</div>`;
  return `<article class="vcard rv" style="transition-delay:${(i%2)*90}ms">${media}
    <div class="vbody">
      <h3>${p.title}</h3>
      <p class="desc">${p.desc}</p>
      <div class="tags">${p.tags.map(t=>`<span>${t}</span>`).join('')}</div>
    </div>
  </article>`;
}

/* 鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲 鐏 鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲 */
const lb=document.getElementById('lightbox');
const lbImg=document.getElementById('lbImg'),lbCap=document.getElementById('lbCap'),lbCount=document.getElementById('lbCount');
let lbList=[],lbIdx=0;
function showLb(i){
  lbIdx=(i+lbList.length)%lbList.length;
  lbImg.src=lbList[lbIdx].src;
  lbCap.textContent=lbList[lbIdx].alt||'';
  lbCount.textContent=String(lbIdx+1).padStart(2,'0')+' / '+String(lbList.length).padStart(2,'0');
}
function openLb(el){
  lbList=[...document.querySelectorAll('.zoom-wrap img')].map(img=>({src:img.getAttribute('src'),alt:img.getAttribute('alt')}));
  lbIdx=lbList.findIndex(x=>x.src===el.getAttribute('src'));
  if(lbIdx<0)lbIdx=0;
  showLb(lbIdx);
  lb.classList.add('open');document.body.classList.add('locked');
}
function closeLb(){lb.classList.remove('open');document.body.classList.remove('locked');setTimeout(()=>{lbImg.removeAttribute('src');},350);}
document.addEventListener('click',e=>{
  const w=e.target.closest('.zoom-wrap img');
  if(w){openLb(w);return;}
  if(e.target.closest('#lbClose')||e.target===lb)closeLb();
  if(e.target.closest('#lbPrev'))showLb(lbIdx-1);
  if(e.target.closest('#lbNext'))showLb(lbIdx+1);
});
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')closeLb();
  if(e.key==='ArrowRight')showLb(lbIdx+1);
  if(e.key==='ArrowLeft')showLb(lbIdx-1);
});

/* 瀵艰埅锛氭粴鍔ㄩ珮浜?+ 鍚搁《 + 杩斿洖椤堕儴 */
const nav=document.getElementById('nav'),totop=document.getElementById('totop');
const sections=[...document.querySelectorAll('section[id]')];
const navLinks=[...document.querySelectorAll('nav a')];
addEventListener('scroll',()=>{
  nav.classList.toggle('solid',scrollY>window.innerHeight*.78);
  totop.classList.toggle('show',scrollY>600);
  let cur='';
  sections.forEach(s=>{if(scrollY>=s.offsetTop-160)cur=s.id;});
  navLinks.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+cur));
},{passive:true});
totop.onclick=()=>scrollTo({top:0,behavior:'smooth'});

/* 鍏ュ満鎻ず */
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}
}),{threshold:.16,rootMargin:'0px 0px -8% 0px'});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
